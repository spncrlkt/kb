# The shipped ensembles: three placements and a mixer.
#
# This file is the source, compiled in with `include_str!`. Each placement
# names an instrument from `instruments.toml` and says where it sits — its
# level, its transpose, its pan and how much reverb it sends. `low` and
# `high` each play one note of the chord and `mid` plays the rest, which is
# why a bass belongs low and a chord-voicing instrument belongs in the middle.

