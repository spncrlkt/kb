# The shipped ensembles: three placements and a mixer.
#
# This file is the source, compiled in with `include_str!`. Each placement
# names an instrument from `instruments.toml` and says where it sits — its
# level, its transpose, its pan and how much reverb it sends.
#
# The three registers are three parts, and the chord is voiced across them:
# `low` takes the root an octave below, `mid` takes the chord itself and
# `high` takes the top note an octave above. So a bass belongs in `low`, a
# chord-voicing instrument in the middle and something that sparkles on top —
# and `transpose` is a colour on top of that, not the thing that makes a
# register the register.

# The first screen: the everyday palette, one per role, most-used first.
# This is what a player sees when they open the picker, so it is deliberately
# varied — a piano, an electric piano, a Wurli, an organ, a pad, a string, a
# pluck, a guitar, mallets, a bell, a clav, two basses, brass, a wind and a
# choir. `Default` stays first because it is the reference point the whole
# palette is described against, not because it is the best sound here.

[[ensembles]]
name = "Default"

[ensembles.low]
instrument = "Deep Sine"
volume = 4.6
transpose = 0.0
reverb_send = 0.1
pan = -0.15

[ensembles.mid]
instrument = "Default low"
volume = 4.0
transpose = 0.0
reverb_send = 0.0
pan = 0.0

[ensembles.high]
instrument = "Bell"
volume = 2.4
transpose = 0.0
reverb_send = 0.32
pan = 0.15

[ensembles.mixer]
reverb_mix = 0.0
reverb_size = 0.5
master_volume = 5.0
master_mute = false
lfo_rate = 5.0
lfo_wave = "sine"
note_length = 1.0

