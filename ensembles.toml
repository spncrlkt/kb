# The rest of the original palette, grouped so neighbours are the same family.
# Every ensemble in the file is three *different* designs — a bass under, the
# named instrument in the middle, a descant on top — because reusing one design
# in all three registers is what made the first pass sound like one instrument
# played three ways. The middle is the ensemble's identity, so no two ensembles
# share one, and the drum kits are the only exception: a drum has no register,
# so all three of theirs are percussion.

