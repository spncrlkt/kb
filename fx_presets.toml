# The shipped effects presets.
#
# This file is the source, compiled in with `include_str!`. Each entry is one
# named effect: a `kind` (the algorithm family), a `subtype` (the variant within
# it) and the five parameter slots that make it that particular sound.
#
# The parameter slots are shared storage whose meaning is declared by the kind,
# so they are always written as five numbers. Read them against this table:
#
#   reverb       size %   damp %   predelay ms   mix %
#   delay        time ms  feedback %   tone %   mix %   sync
#   chorus       rate Hz  depth %  spread %  mix %
#   flanger      rate Hz  depth %  feedback %  mix %
#   phaser       rate Hz  depth %  feedback %  mix %
#   distortion   drive dB  tone %  level dB  mix %
#   fuzz         drive dB  bias %  gate %  level dB
#   bitcrusher   bits  rate %  mix %
#   ringmod      freq Hz  depth %  mix %
#   tremolo      rate Hz  depth %  mix %
#   filter       cutoff Hz  resonance %  drive dB  mix %
#   wah          sens %  range %  resonance %  rate Hz  mix %
#   compressor   threshold dB  ratio  attack ms  release ms  makeup dB
#   gate         threshold dB  attack ms  hold ms  release ms  rate Hz
#
# The reverb and delay mixes are 0 in the *defaults* on purpose: `hall` and
# `digital` are the tank and the line this crate has always had, and every shipped
# ensemble is silent on both. A preset here turns one up, which is what the
# `preset` row is for — one press from `custom` to a sound with a name.
#
# Every kind and variant ships with at least one preset, so no `preset` row is
# ever an empty list. Each preset's parameters are inside the range its kind
# declares, and a test holds that.

