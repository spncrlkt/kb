# The shipped instrument library: one register-neutral voice per entry.
#
# This file is the source. It is compiled into the binary with `include_str!`
# and parsed at start-up, so editing it here is how the library is changed —
# there is no Rust to keep in step and nothing to regenerate.
#
# An instrument holds no level, no pan and no transpose: those are decisions
# about where a sound sits, and they live in the placement that puts it in an
# ensemble.

